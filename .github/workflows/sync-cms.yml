name: Sync CMS Data from Airtable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run CMS Sync Script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: appB0MrrpweuNvlQd
        run: node scripts/sync-airtable.cjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/data/blog/*.json client/public/blog-articles/*.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync CMS data from Airtable [skip ci]" && git push)
