name: Sync Airtable CMS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Sync from Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: node scripts/sync-airtable.cjs
      - name: Commit and Push changes
        run: |
          git config --global user.name 'Airtable CMS Bot'
          git config --global user.email 'bot@boostnow.pl'
          git add .
          git commit -m "Automatyczna synchronizacja z Airtable [skip ci]" || echo "Brak zmian"
          git push
