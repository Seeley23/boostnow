name: Setup Airtable CMS Structure
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install axios
      - name: Run Setup Script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          cat << 'EOF' > setup.js
          const axios = require('axios');
          const AIRTABLE_API_KEY = process.env.AIRTABLE_API_KEY;
          const AIRTABLE_BASE_ID = 'appB0MrrpweuNvlQd';
          async function createTable(tableData) {
            try {
              console.log(`Tworzenie tabeli: ${tableData.name}...`);
              const response = await axios.post(`https://api.airtable.com/v0/meta/bases/${AIRTABLE_BASE_ID}/tables`, tableData, {
                headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}`, 'Content-Type': 'application/json' }
              } );
              console.log(`Sukces! Tabela ${tableData.name} utworzona.`);
              return response.data;
            } catch (e) { console.log(`Tabela ${tableData.name} już istnieje lub błąd.`); }
          }
          async function setup() {
            const pages = await createTable({
              name: "Pages",
              fields: [
                { name: "Slug", type: "singleLineText" },
                { name: "PageName", type: "singleLineText" },
                { name: "SEO_Title", type: "singleLineText" },
                { name: "SEO_Desc", type: "multilineText" },
                { name: "Status", type: "singleSelect", options: { choices: [{ name: "Draft" }, { name: "Published" }] } }
              ]
            });
            await createTable({
              name: "Page_Sections",
              fields: [
                { name: "Page", type: "multipleRecordLinks", options: { foreignTableId: pages ? pages.id : "Pages" } },
                { name: "Section_Type", type: "singleSelect", options: { choices: [{ name: "Hero" }, { name: "Problem" }, { name: "Solution" }, { name: "Services" }, { name: "Results" }, { name: "Urgency" }, { name: "Target" }, { name: "Process" }, { name: "FAQ" }, { name: "Contact" }] } },
                { name: "Order", type: "number", options: { precision: 0 } },
                { name: "Title", type: "singleLineText" },
                { name: "Content", type: "multilineText" },
                { name: "Extra_Data", type: "multilineText" }
              ]
            });
          }
          setup();
          EOF
          node setup.js
